[build-system]
requires=["setuptools>=75","wheel"]
build-backend="setuptools.build_meta"
[project]
name="swin-classification-finetuner"
version="0.1.0"
description="NATIVE ml-worker SwinV2 image-classification finetuner"
requires-python=">=3.11"
license={text="MIT"}
# trainer.py imports PIL and safetensors directly, so they are declared here
# rather than inherited implicitly through timm/torchvision. Pinned to the
# versions recorded in the qualification freeze; see constraints-qualified.txt.
dependencies=["timm==1.0.28","Pillow==12.3.0","safetensors==0.8.0"]
[project.scripts]
swin-classification-train="swin_classification_finetuner.trainer:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
