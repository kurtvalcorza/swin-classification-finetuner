[build-system]
requires=["setuptools>=75","wheel"]
build-backend="setuptools.build_meta"
[project]
name="swin-classification-finetuner"
version="0.1.0"
description="NATIVE ml-worker SwinV2 image-classification finetuner"
requires-python=">=3.11"
dependencies=["timm==1.0.28"]
[project.scripts]
swin-classification-train="swin_classification_finetuner.trainer:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
